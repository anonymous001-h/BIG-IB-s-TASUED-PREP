        // Get parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const selectedSubjects = urlParams.getAll('subjects[]');
        const testMode = urlParams.get('test-mode');
        const customQuestions = urlParams.get('custom-questions');

        if (testMode === 'exam') {
            questionsPerSubject = 40;
        } else if (testMode === 'custom') {
            questionsPerSubject = parseInt(customQuestions) || 20;
        } else {
            questionsPerSubject = 20;
        }
        
        // Initialize exam state
        let currentSubjectIndex = 0;
        let currentQuestionIndex = 0;
        let userAnswers = {};
        
        // Initialize subjects and questions
        const examSubjects = selectedSubjects.filter(subject => examData[subject]); // Filter out subjects with no questions
        let totalQuestionsCount = examSubjects.length * questionsPerSubject;
        
        // Initialize user answers structure
        examSubjects.forEach(subject => {
            userAnswers[subject] = Array(questionsPerSubject).fill(null);
        });
        
        // Update UI elements
        document.getElementById('total-questions').textContent = totalQuestionsCount;
        
        // Create subject tabs
        const subjectTabsContainer = document.getElementById('subject-tabs');
        examSubjects.forEach((subject, index) => {
            const tab = document.createElement('button');
            tab.className = 'subject-tab' + (index === 0 ? ' active' : '');
            tab.textContent = subject.charAt(0).toUpperCase() + subject.slice(1);
            tab.dataset.subject = subject;
            tab.dataset.index = index;
            tab.addEventListener('click', () => switchSubject(index));
            subjectTabsContainer.appendChild(tab);
        });
        
        // Create question number buttons
        function updateQuestionNumbers() {
            const questionNumbersContainer = document.getElementById('question-numbers');
            questionNumbersContainer.innerHTML = '';
            
            const currentSubject = examSubjects[currentSubjectIndex];
            
            for (let i = 0; i < questionsPerSubject; i++) {
                const button = document.createElement('button');
                button.className = 'question-number';
                if (currentSubjectIndex === currentSubjectIndex && i === currentQuestionIndex) {
                    button.classList.add('current');
                }
                if (userAnswers[currentSubject][i] !== null) {
                    button.classList.add('answered');
                }
                button.textContent = i + 1;
                button.addEventListener('click', () => goToQuestion(i));
                questionNumbersContainer.appendChild(button);
            }
        }
        
        // Switch to a different subject
        function switchSubject(subjectIndex) {
            currentSubjectIndex = subjectIndex;
            currentQuestionIndex = 0;
            
            // Update subject tabs
            document.querySelectorAll('.subject-tab').forEach((tab, index) => {
                if (index === subjectIndex) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
            
            updateQuestionNumbers();
            loadCurrentQuestion();
        }
        
        // Go to a specific question within the current subject
        function goToQuestion(questionIndex) {
            currentQuestionIndex = questionIndex;
            updateQuestionNumbers();
            loadCurrentQuestion();
        }
        
        // Load the current question
        function loadCurrentQuestion() {
            const currentSubject = examSubjects[currentSubjectIndex];
            const currentQuestion = examData[currentSubject][currentQuestionIndex];
            
            // Update header info
            document.getElementById('current-subject').textContent = `Subject: ${currentSubject.charAt(0).toUpperCase() + currentSubject.slice(1)}`;
            document.getElementById('current-question').textContent = calculateOverallQuestionNumber();
            document.getElementById('question-number').textContent = `Question ${currentQuestionIndex + 1}`;
            document.getElementById('question-subject').textContent = `Subject: ${currentSubject.charAt(0).toUpperCase() + currentSubject.slice(1)}`;
            
            // Update question text
            document.getElementById('question-text').textContent = currentQuestion.question;
            
            // Update options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            currentQuestion.options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                
                const userAnswer = userAnswers[currentSubject][currentQuestionIndex];
                if (userAnswer === index) {
                    optionElement.classList.add('selected');
                }
                
                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'answer';
                radio.id = `option-${index}`;
                radio.value = index;
                radio.checked = userAnswer === index;
                
                const label = document.createElement('label');
                label.htmlFor = `option-${index}`;
                label.textContent = option;
                
                optionElement.appendChild(radio);
                optionElement.appendChild(label);
                
                optionElement.addEventListener('click', () => {
                    // Select this option
                    document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
                    optionElement.classList.add('selected');
                    radio.checked = true;
                    
                    // Save the answer
                    userAnswers[currentSubject][currentQuestionIndex] = index;
                    
                    // Update question number button to show it's answered
                    updateQuestionNumbers();
                });
                
                optionsContainer.appendChild(optionElement);
            });
            
            // Update navigation buttons
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const submitBtn = document.getElementById('submit-btn');
            
            // Disable previous button on first question of first subject
            prevBtn.disabled = currentSubjectIndex === 0 && currentQuestionIndex === 0;
            
            // Show submit button on last question of last subject, otherwise show next button
            if (currentSubjectIndex === examSubjects.length - 1 && currentQuestionIndex === questionsPerSubject - 1) {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'block';
            } else {
                nextBtn.style.display = 'block';
                submitBtn.style.display = 'none';
            }
        }
        
        // Calculate the overall question number (across all subjects)
        function calculateOverallQuestionNumber() {
            return (currentSubjectIndex * questionsPerSubject) + currentQuestionIndex + 1;
        }
        
        // Navigate to previous question
        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
            } else if (currentSubjectIndex > 0) {
                currentSubjectIndex--;
                currentQuestionIndex = questionsPerSubject - 1;
                
                // Update subject tabs
                document.querySelectorAll('.subject-tab').forEach((tab, index) => {
                    if (index === currentSubjectIndex) {
                        tab.classList.add('active');
                    } else {
                        tab.classList.remove('active');
                    }
                });
            }
            
            updateQuestionNumbers();
            loadCurrentQuestion();
        });
        
        // Navigate to next question
        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentQuestionIndex < questionsPerSubject - 1) {
                currentQuestionIndex++;
            } else if (currentSubjectIndex < examSubjects.length - 1) {
                currentSubjectIndex++;
                currentQuestionIndex = 0;
                
                // Update subject tabs
                document.querySelectorAll('.subject-tab').forEach((tab, index) => {
                    if (index === currentSubjectIndex) {
                        tab.classList.add('active');
                    } else {
                        tab.classList.remove('active');
                    }
                });
            }
            
            updateQuestionNumbers();
            loadCurrentQuestion();
        });
        
        // Show submit confirmation
        document.getElementById('submit-btn').addEventListener('click', () => {
            // Check for unanswered questions
            let unansweredCount = 0;
            for (const subject in userAnswers) {
                unansweredCount += userAnswers[subject].filter(answer => answer === null).length;
            }
            
            const unansweredWarning = document.getElementById('unanswered-warning');
            if (unansweredCount > 0) {
                unansweredWarning.style.display = 'block';
                document.getElementById('unanswered-count').textContent = `${unansweredCount}`;
            } else {
                unansweredWarning.style.display = 'none';
            }
            
            document.getElementById('submit-confirmation').style.display = 'flex';
        });
        
        // Handle submit confirmation
        document.getElementById('cancel-submit').addEventListener('click', () => {
            document.getElementById('submit-confirmation').style.display = 'none';
        });
        
        document.getElementById('confirm-submit').addEventListener('click', () => {
            // In a real application, this would submit the answers to the server
            // For this demo, we'll redirect to the results page with the answers as parameters
            let resultsUrl = 'results.html?';
            
            // Add subjects and answers
            for (const subject in userAnswers) {
                resultsUrl += `subject=${subject}&`;
                resultsUrl += `answers=${userAnswers[subject].join(',')}&`;
            }
            
            // Add test mode
            resultsUrl += `test-mode=${testMode}`;
            if (testMode === 'custom') {
                resultsUrl += `&custom-questions=${questionsPerSubject}`;
            }
            
            window.location.href = resultsUrl;
        });
        
        // Initialize the exam
        updateQuestionNumbers();
        loadCurrentQuestion();
    </script>
</body>
</html>
